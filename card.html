<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>내 명함</title>
<style>
  :root{
    --brand-1:#0b3d91;
    --brand-2:#1b63c9;
    --ink:#1a1a1a;
    --muted:#6b7280;
    --bg:#eef2f7;
    --card-bg:#ffffff;
    --line:#e5e7eb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:linear-gradient(180deg,var(--bg),#dbe4f0);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px 48px;
  }
  .wrap{width:100%;max-width:420px;}
  .card{
    background:var(--card-bg);
    border-radius:20px;
    box-shadow:0 12px 30px rgba(15,35,80,.16);
    overflow:hidden;
  }
  .card-header{
    background:linear-gradient(135deg,var(--brand-1),var(--brand-2));
    color:#fff;
    padding:28px 24px 22px;
    position:relative;
    overflow:hidden;
  }
  .card-header .emblem{
    position:absolute;
    right:-18px;
    top:-18px;
    width:120px;
    height:120px;
    object-fit:contain;
    opacity:.16;
  }
  .card-header .school{
    font-size:13px;
    letter-spacing:.02em;
    opacity:.92;
    margin:0 0 2px;
  }
  .card-header .dept{
    font-size:13px;
    opacity:.85;
    margin:0 0 14px;
  }
  .card-header .name-ko{
    font-size:26px;
    font-weight:700;
    margin:0;
    line-height:1.25;
  }
  .card-header .name-en{
    font-size:14px;
    font-weight:400;
    opacity:.85;
    margin:2px 0 0;
  }
  .card-header .title-badge{
    display:inline-block;
    margin-top:10px;
    padding:4px 10px;
    font-size:12px;
    border-radius:999px;
    background:rgba(255,255,255,.18);
  }
  .card-body{padding:20px 24px 24px;}
  .info-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .icon{
    width:34px;height:34px;flex:0 0 34px;
    border-radius:10px;
    background:#eef2ff;
    color:var(--brand-2);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .info-row .label{font-size:11px;color:var(--muted);margin:0 0 2px;}
  .info-row .value{font-size:15px;font-weight:600;margin:0;word-break:break-all;}
  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:4px 24px 24px;
  }
  .actions a, .actions button{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 10px;
    border-radius:12px;
    border:none;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    font-family:inherit;
  }
  .btn-primary{background:var(--brand-2);color:#fff;}
  .btn-secondary{background:#eef2ff;color:var(--brand-1);}
  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    padding:0 24px 22px;
  }
  .state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
  }
  .state .spinner{
    width:28px;height:28px;margin:0 auto 14px;
    border:3px solid #cbd5e1;
    border-top-color:var(--brand-2);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  [hidden]{display:none!important;}
</style>
</head>
<body>
  <div class="wrap">

    <div id="loading" class="card">
      <div class="state">
        <div class="spinner"></div>
        명함 정보를 불러오는 중입니다…
      </div>
    </div>

    <div id="error" class="card" hidden>
      <div class="state">
        명함 정보를 찾을 수 없습니다.<br/>QR코드를 다시 확인해 주세요.
      </div>
    </div>

    <div id="card" class="card" hidden>
      <div class="card-header">
        <img class="emblem" id="f-emblem" src="" alt="" aria-hidden="true" />
        <p class="school" id="f-school"></p>
        <p class="dept" id="f-dept"></p>
        <p class="name-ko" id="f-nameKo"></p>
        <p class="name-en" id="f-nameEn"></p>
        <span class="title-badge" id="f-title"></span>
      </div>

      <div class="card-body">
        <div class="info-row">
          <div class="icon">☎</div>
          <div>
            <p class="label">내선번호</p>
            <p class="value" id="f-ext"></p>
          </div>
        </div>
        <div class="info-row">
          <div class="icon">🏫</div>
          <div>
            <p class="label">소속</p>
            <p class="value" id="f-org"></p>
          </div>
        </div>
      </div>

      <div class="actions">
        <a id="btn-call" class="btn-primary" href="#">전화 걸기</a>
        <button id="btn-vcard" class="btn-secondary" type="button">연락처 저장</button>
      </div>

      <p class="footer-note">이 페이지는 학교 공식 디지털 명함입니다.</p>
    </div>

  </div>

<script>
  /* ============================================================
   * 설정: Google Apps Script 배포 후 발급된 웹 앱 URL(…/exec)을 넣으세요.
   * ============================================================ */
  var CONFIG = {
    API_URL: 'https://script.google.com/macros/s/AKfycbzPBioUdQRrRM9gkFe_UBXkd6QUkkaW9HohZAL91VuPa3uS1JY48mM65oVydxudUcDCIQ/exec',
    LOGO_DIR: 'assets/logos/',
    DEFAULT_LOGO: 'default.png'
  };

  function qs(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function show(id) {
    ['loading', 'error', 'card'].forEach(function (x) {
      document.getElementById(x).hidden = (x !== id);
    });
  }

  function fetchViaJsonp(url) {
    return new Promise(function (resolve, reject) {
      var cbName = 'cardCb_' + Date.now();
      var script = document.createElement('script');
      var timer = setTimeout(function () {
        cleanup();
        reject(new Error('timeout'));
      }, 8000);

      function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        script.remove();
      }

      window[cbName] = function (data) {
        cleanup();
        resolve(data);
      };
      script.src = url + (url.indexOf('?') > -1 ? '&' : '?') + 'callback=' + cbName;
      script.onerror = function () {
        cleanup();
        reject(new Error('jsonp load error'));
      };
      document.body.appendChild(script);
    });
  }

  async function loadCard() {
    var id = qs('id');
    if (!id || CONFIG.API_URL.indexOf('여기에') > -1) {
      show('error');
      return;
    }
    var url = CONFIG.API_URL + '?id=' + encodeURIComponent(id);

    var result;
    try {
      var res = await fetch(url);
      result = await res.json();
    } catch (e) {
      try {
        result = await fetchViaJsonp(url);
      } catch (e2) {
        show('error');
        return;
      }
    }

    if (!result || !result.ok) {
      show('error');
      return;
    }
    render(result.data);
  }

  function render(d) {
    document.getElementById('f-school').textContent = d.school || '';
    document.getElementById('f-dept').textContent = d.dept || '';
    document.getElementById('f-nameKo').textContent = d.nameKo || '';
    document.getElementById('f-nameEn').textContent = d.nameEn || '';
    document.getElementById('f-title').textContent = d.title || '';
    document.getElementById('f-ext').textContent = d.ext || '-';
    document.getElementById('f-org').textContent = [d.school, d.dept].filter(Boolean).join(' · ');
    document.getElementById('f-emblem').src = CONFIG.LOGO_DIR + (d.emblem || CONFIG.DEFAULT_LOGO);

    var telDigits = (d.ext || '').replace(/[^0-9+]/g, '');
    var callBtn = document.getElementById('btn-call');
    if (telDigits) {
      callBtn.href = 'tel:' + telDigits;
    } else {
      callBtn.style.display = 'none';
    }

    document.getElementById('btn-vcard').addEventListener('click', function () {
      downloadVcard(d);
    });

    document.title = (d.nameKo || '내 명함') + ' · ' + (d.school || '');
    show('card');
  }

  function downloadVcard(d) {
    var lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + (d.nameKo || '') + ';;;;',
      'FN:' + (d.nameKo || ''),
      d.nameEn ? 'NICKNAME:' + d.nameEn : '',
      'ORG:' + [d.school, d.dept].filter(Boolean).join(' '),
      'TITLE:' + (d.title || ''),
      d.ext ? 'TEL;TYPE=WORK,VOICE:' + d.ext : '',
      'END:VCARD'
    ].filter(Boolean).join('\n');

    var blob = new Blob([lines], { type: 'text/vcard;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (d.nameKo || 'contact') + '.vcf';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  loadCard();
</script>
</body>
</html>
